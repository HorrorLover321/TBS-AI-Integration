plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'net.tbsai'
version = '1.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.265'

    mods {
        tbsai {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    addModdingDependenciesTo(sourceSets.test)
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('../thebrokenscript.jar')
    compileOnly files('libs/brokencore.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Guardrail: the mod JAR must never bundle TBS/Minecraft/Kotlin classes (they are compileOnly)
tasks.register('verifyJarContents') {
    group = 'verification'
    description = 'Fails if the mod JAR bundles forbidden classes (net/thebrokenscript, net/minecraft, kotlin).'
    dependsOn tasks.jar
    def jarProvider = tasks.jar.archiveFile
    doLast {
        def jarFile = jarProvider.get().asFile
        def forbidden = ~/net\/thebrokenscript|net\/minecraft|kotlin/
        def offenders = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name =~ forbidden) {
                    offenders << entry.name
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden entries bundled in ${jarFile.name}:\n  " + offenders.join('\n  '))
        }
        logger.lifecycle("verifyJarContents: ${jarFile.name} contains no forbidden classes")
    }
}

tasks.named('check') {
    dependsOn tasks.verifyJarContents
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
